<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Yashashri StudyHub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Yashashri StudyHub</h1>
      <button onclick="adminLogin()" class="admin-btn">Admin Login</button>
    </header>

    <div class="main">
      <aside class="sidebar">
        <ul>
          <li onclick="startNewChat()" class="new-chat-btn">New Chat</li>
          <li onclick="showSection('library')">Library</li>
          <li onclick="showSection('contacts')">Contacts</li>
          <li onclick="showSection('complaints')">Complaints</li>
          <hr class="divider">

          <!-- Admin ke liye buttons -->
          <div id="adminControls" style="display:none; padding:10px;">
            <button onclick="addQuickNote()" class="add-btn">+ Quick Note</button><br><br>
            <button onclick="document.getElementById('fileUpload').click()" class="add-btn">+ Upload File</button>
            <input type="file" id="fileUpload" style="display:none" onchange="uploadFile(this.files[0])" accept=".pdf,.txt,.jpg,.png,.jpeg">
          </div>

          <div id="chatHistoryList" class="history-list"></div>
        </ul>
      </aside>

      <section class="content" id="contentArea">
        <div id="chat" class="section active">
          <div id="chatMessages" class="messages"></div>
          <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask anything..." onkeypress="if(event.key==='Enter') sendMessage()" />
            <button onclick="sendMessage()">Send</button>
          </div>
        </div>

        <div id="library" class="section">
          <h2>Library</h2>
          <div id="libraryItems"></div>
        </div>

        <div id="contacts" class="section">
          <h2>Contacts</h2>
          <div id="contactList"></div>
        </div>

        <div id="complaints" class="section">
          <h2>Complaints</h2>
          <button onclick="openComplaintForm()" class="add-btn">+ Add Complaint</button>
          <div id="complaintList"></div>
        </div>
      </section>
    </div>
  </div>

  <!-- Modals -->
  <div id="complaintModal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="close" onclick="closeComplaintForm()">&times;</span>
      <h3>Add Complaint</h3>
      <input type="text" id="complaintSubject" placeholder="Subject" required /><br><br>
      <textarea id="complaintDesc" placeholder="Description" required></textarea><br><br>
      <button onclick="submitComplaintForm()">Submit</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
