<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Yashashri StudyHub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Hamburger Menu Button (ChatGPT jaisa) -->
  <div class="mobile-menu-btn" onclick="toggleSidebar()">☰</div>

  <div class="container">
    <header class="header">
      <h1>Yashashri StudyHub</h1>
      <button onclick="adminLogin()" class="admin-btn">Admin</button>
    </header>

    <!-- Sidebar (slide in from left) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>Menu</h2>
        <span class="close-btn" onclick="toggleSidebar()">✕</span>
      </div>
      <ul>
        <li onclick="startNewChat();toggleSidebar()">New Chat</li>
        <li onclick="showSection('library');toggleSidebar()">Library</li>
        <li onclick="showSection('contacts');toggleSidebar()">Contacts</li>
        <li onclick="showSection('complaints');toggleSidebar()">Complaints</li>
      </ul>
      <div id="adminControls" style="display:none; padding:15px;">
        <button onclick="addContactPrompt()" class="add-btn">+ Add Contact</button>
      </div>
    </aside>

    <!-- Overlay when menu open -->
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- Main Content -->
    <section class="content">
      <div id="chat" class="section active">
        <div id="chatMessages" class="messages"></div>
        <div class="input-area">
          <input type="text" id="userInput" placeholder="Message StudyHub..." onkeypress="if(event.key==='Enter') sendMessage()" />
          <button onclick="sendMessage()">Send</button>
        </div>
      </div>

      <div id="library" class="section">
        <h2>Library</h2>
        <div id="libraryItems"></div>
      </div>

      <div id="contacts" class="section">
        <h2>Important Contacts</h2>
        <div id="contactList"></div>
      </div>

      <div id="complaints" class="section">
        <h2>Complaints</h2>
        <button onclick="openComplaintForm()" class="add-btn">+ Add Complaint</button>
        <div id="complaintList"></div>
      </div>
    </section>
  </div>

  <!-- Complaint Modal -->
  <div id="complaintModal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="close" onclick="closeComplaintForm()">✕</span>
      <h3>Add Complaint</h3>
      <input type="text" id="complaintSubject" placeholder="Subject" /><br><br>
      <textarea id="complaintDesc" placeholder="Description"></textarea><br><br>
      <button onclick="submitComplaintForm()">Submit</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
