<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StudyHub</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.4.2/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
</head>
<body>
  <div class="container">
    <header class="header"><h1>StudyHub</h1></header>
    <div class="main">
      <aside class="sidebar">
        <ul>
          <li onclick="startNewChat()" class="new-chat-btn" style="background:#4ade80; color:#000; font-weight:bold;">New Chat</li>
          <li onclick="showSection('library')">Library</li>
          <li onclick="showSection('contacts')">Contacts</li>
          <li onclick="showSection('complaints')">Complaints</li>
          <hr class="divider">
          <div id="chatHistoryList" class="history-list"></div>
        </ul>
      </aside>
      <section class="content" id="contentArea">
        <div id="chat" class="section active">
          <div id="chatMessages" class="messages"></div>
          <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask anything..." onkeypress="if(event.key==='Enter') sendMessage()" />
            <button onclick="sendMessage()">Send</button>
          </div>
        </div>
        <div id="library" class="section">
          <h2>Library</h2>
          <div id="libraryItems"></div>
          <div style="margin-top:20px; padding:15px; background:#1f1f1f; border-radius:10px;">
            <input type="file" id="fileUpload" accept=".pdf,.docx,.txt,.jpg,.jpeg,.png" style="width:100%; padding:10px; background:#252525; color:#fff; border:none; border-radius:8px;" />
            <button id="uploadBtn" onclick="uploadFile()" class="add-btn">Upload File</button>
            <p id="uploadStatus" style="font-size:0.8rem; color:#aaa; margin-top:8px; display:none;"></p>
          </div>
        </div>
        <div id="contacts" class="section">
          <h2>Contacts</h2>
          <div style="margin-bottom:15px;">
            <input type="text" id="newContactName" placeholder="Name" />
            <input type="tel" id="newContactPhone" placeholder="Phone (optional)" />
            <button onclick="addContact()">Add</button>
          </div>
          <div id="contactList"></div>
        </div>
        <div id="complaints" class="section">
          <h2>Complaints</h2>
          <button onclick="openComplaintForm()" class="add-btn" style="background:#e67e22; margin-bottom:15px;">+ Add Complaint</button>
          <div id="complaintList"></div>
        </div>
      </section>
    </div>
  </div>
  <div id="fileModal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h3 id="modalTitle">File Content</h3>
      <div id="modalBody" style="max-height:70vh; overflow-y:auto; padding:15px; background:#1a1a1a; border-radius:8px; white-space:pre-wrap; font-family: monospace; font-size:0.9rem;"></div>
    </div>
  </div>
  <div id="complaintModal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="close" onclick="closeComplaintForm()">&times;</span>
      <h3>Add New Complaint</h3>
      <form onsubmit="submitComplaintForm(event)">
        <input type="text" id="complaintSubject" placeholder="Subject (e.g., Slow Internet)" required style="width:100%; margin:10px 0;" />
        <textarea id="complaintDesc" placeholder="Describe the issue..." required style="height:120px; margin:10px 0;"></textarea>
        <button type="submit" style="background:#27ae60; width:100%; padding:12px; font-weight:bold;">Submit Complaint</button>
      </form>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
